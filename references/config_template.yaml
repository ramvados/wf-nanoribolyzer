sample_folder: /path/to/pod5_folder/
color: blue
script_folder: /path/to/wf-nanoribolyzer/
out_dir: /path/to/output_dir/
basecalling_model: sup
model_organism: Human
threads: 8
sample_type: RNA
demand: low

# Available methods: porechop or barbell
preprocessing_method: porechop

# Barbell can process samples separately. Porechop requires false.
demultiplex: false
sample_name: sample

# Optional Barbell settings:
# barbell_barcode_fasta: /path/to/barcodes.fasta
# barbell_filters: /path/to/barbell_filters.txt
# barcodes:
#   - RNA01
#   - RNA02

# Optional settings for a local Dorado installation:
# dorado_executable: /path/to/dorado
# dorado_models_directory: /path/to/dorado_models
# dorado_rna_model: /path/to/base_model
# dorado_modified_bases_models: /path/to/model1,/path/to/model2
